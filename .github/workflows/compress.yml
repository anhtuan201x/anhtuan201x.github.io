name: Auto Scan and Update Cydia Repo

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'debs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dpkg-dev tools
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev

    - name: Execute CydiaBlock Core Scripts
      run: |
        chmod +x control.sh sync.sh
        ./control.sh

    - name: Commit and Push changes by action-user
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Packages Packages.bz2 debs/
        git commit -m "Repo successfully synchronized by CydiaBlock infrastructure!" || exit 0
        git push
