name: Auto Convert IPA to DEB and Update Repo

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ipas/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dpkg and extract tools
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev unzip

    - name: Auto Convert IPA to DEB
      run: |
        mkdir -p debs
        if [ -d "ipas" ] && [ "$(ls -A ipas/*.ipa 2>/dev/null)" ]; then
          for ipa_file in ipas/*.ipa; do
            filename=$(basename "$ipa_file" .ipa)
            clean_filename=$(echo "$filename" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9.-')
            
            mkdir -p "tmp_$clean_filename"
            unzip -q "$ipa_file" -d "tmp_$clean_filename"
            
            mkdir -p "deb_build_$clean_filename/Applications"
            mkdir -p "deb_build_$clean_filename/DEBIAN"
            
            cp -r tmp_$clean_filename/Payload/*.app "deb_build_$clean_filename/Applications/"
            
            cat <<EOF > "deb_build_$clean_filename/DEBIAN/control"
Package: com.anhtuan.$clean_filename
Name: $filename
Version: 1.0
Architecture: iphoneos-arm
Maintainer: AnhTuan201X <anhtuan201x@github.io>
Section: Applications
Description: Game va Ung dung do robot cua Anh Tuan tu dong dong goi truc tuyen.
EOF

            sed -i 's/\r$//' "deb_build_$clean_filename/DEBIAN/control"
            dpkg-deb --build "deb_build_$clean_filename" "debs/${clean_filename}.deb"
            
            rm -rf "tmp_$clean_filename" "deb_build_$clean_filename"
            rm -f "$ipa_file"
          done
        fi

    - name: Scan Packages and Compress
      run: |
        dpkg-scanpackages -m debs /dev/null > Packages
        sed -i 's/\r$//' Packages
        bzip2 -fk Packages

    - name: Commit and Push changes by action-user
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add debs/ Packages Packages.bz2 ipas/
        git commit -m "Robot auto-converted IPA to DEB and updated Cydia Repo!" || exit 0
        git push
