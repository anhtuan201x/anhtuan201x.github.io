name: Auto Scan and Update Cydia Repo

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 */12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev unzip

    - name: Execute Core Scripts
      run: |
        chmod +x sync.sh
        ./sync.sh

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Packages Packages.bz2 Release debs/
        git commit -m "Scheduled Repo cleanup and optimization by action-user!" || exit 0
        git push
