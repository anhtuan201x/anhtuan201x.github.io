<!DOCTYPE html>
<html>
<head>
    <title>AnhTuan Repo</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { 
            font-family: -apple-system, Helvetica, Arial, sans-serif; 
            background-color: #efeff4; 
            text-align: center; 
            margin: 0; 
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container { 
            max-width: 85%; 
            width: 360px;
            background: white; 
            border: 1px solid #dcdcdc; 
            border-radius: 12px; 
            padding: 30px 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }
        .logo { 
            width: 80px; 
            height: 80px; 
            border-radius: 18px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        h1 { 
            color: #1d1d26; 
            font-size: 22px; 
            margin: 0 0 8px 0; 
            font-weight: 600;
        }
        p { 
            color: #8e8e93; 
            font-size: 14px; 
            margin: 0 0 25px 0;
            line-height: 1.4;
        }
        .btn-add { 
            display: block; 
            background-color: #4cd964; 
            color: white; 
            font-weight: bold; 
            text-decoration: none; 
            padding: 14px 0; 
            border-radius: 25px; 
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(76,217,100,0.2); 
            transition: background-color 0.2s;
        }
        .btn-add:active { 
            background-color: #3cc755; 
        }
        
        .btn-add:hover {
            animation: shakeEffect 0.3s infinite;
        }
        @keyframes shakeEffect {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="CydiaIcon.png" class="logo" alt="Repo Logo">
        <h1>AnhTuan Repo</h1>
        <p>Kho luu tru Tweak va Ung dung Legacy danh rieng cho iOS 6.</p>
        
        <a class="btn-add" href="cydia://url/http://cydia.saurik.com/api/share/#http://anhtuan201x.github.io/">Add to Cydia</a>
    </div>
</body>
</html>
